# CI — S2.4 (docs/SIMPLIFICATION-PLAN.md).
#
# Three gates on every push/PR: the full plain-Node test suite, the
# module-load sweep (imports every src module — the no-bundler substitute
# for a build step), and ESLint (correctness rules are errors; style rules
# are warnings until the S3/S4 cleanup ratchets them).
#
# The generated-data locks (LOCK A/B) are NOT run here: tools/preprocess.mjs
# may fetch community data sources over the network, so the locks stay a
# local pre-commit step (see CLAUDE.md, Test commands).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sweep
      - run: npm run lint
